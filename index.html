<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<meta name="description" content="《党建研究》杂志全文检索系统，覆盖2020-2026年全期">
<title>《党建研究》全文检索</title>
<link rel="stylesheet" href="assets/css/style.css?v=20260725b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237f1d1d' stroke-width='2'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">
</head>
<body>

<!-- SVG icon definitions -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
<symbol id="i-star-fill" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
<symbol id="i-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
<symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
</svg>

<!-- ===== 主应用 ===== -->
<div id="app">
<!-- 头部 -->
<header class="app-header">
    <h1>《党建研究》全文检索</h1>
    <p class="app-subtitle">2020-2026 全期 · <span id="totalCount">-</span> 篇文章</p>
    <div class="search-status" id="searchStatus">加载中...</div>
</header>

<!-- 搜索栏（标题下方，始终显示） -->
<section class="search-bar" id="searchBar">
    <div class="search-box">
        <svg class="icon search-icon"><use href="#i-search"/></svg>
        <input type="text" id="searchInput" placeholder="搜索标题、作者或正文..." autocomplete="off">
        <button class="search-clear" id="searchClear" style="display:none;"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="filters" id="filters">
        <select id="filterYear"><option value="">全部年份</option></select>
        <select id="filterSection"><option value="">全部板块</option></select>
        <label class="filter-check"><input type="checkbox" id="bodyOnly"> 仅看有全文</label>
    </div>
</section>

<!-- 桌面端导航（3个标签） -->
<nav class="nav-tabs desktop-only">
    <button class="nav-tab active" data-mode="section"><svg class="icon"><use href="#i-grid"/></svg>板块</button>
    <button class="nav-tab" data-mode="catalog"><svg class="icon"><use href="#i-list"/></svg>目录</button>
    <button class="nav-tab" data-mode="favorites"><svg class="icon"><use href="#i-bookmark"/></svg>收藏 <span class="fav-badge" id="favBadgeTop">0</span></button>
</nav>

<!-- 内容区 -->
<main class="content">
    <div class="view" id="searchView">
        <div class="result-info" id="resultInfo"></div>
        <div id="searchResults" class="results-list"></div>
    </div>
    <div class="view active" id="sectionView">
        <div id="sectionContent" class="section-list"></div>
    </div>
    <div class="view" id="catalogView">
        <div id="catalogContent" class="catalog-list"></div>
    </div>
    <div class="view" id="favoritesView">
        <div id="favoritesContent" class="favorites-list"></div>
    </div>
</main>

<!-- 底部导航（移动端，3个标签） -->
<nav class="bottom-nav mobile-only">
    <button class="bn-item active" data-mode="section">
        <svg class="icon"><use href="#i-grid"/></svg><span class="bn-label">板块</span>
    </button>
    <button class="bn-item" data-mode="catalog">
        <svg class="icon"><use href="#i-list"/></svg><span class="bn-label">目录</span>
    </button>
    <button class="bn-item" data-mode="favorites">
        <svg class="icon"><use href="#i-bookmark"/></svg><span class="bn-label">收藏</span>
        <span class="fav-badge" id="favBadgeBottom">0</span>
    </button>
</nav>
</div><!-- /#app -->

<!-- ===== 文章页面（独立全屏页面） ===== -->
<div id="articlePage" class="article-page">
    <div class="reading-progress" id="readingProgress"></div>
    <header class="article-page-header">
        <button class="ap-back-btn" onclick="goBack()"><svg class="icon"><use href="#i-arrow-left"/></svg><span>返回</span></button>
        <div class="ap-actions">
            <button class="ap-fav-btn" id="articleFavBtn" onclick="toggleArticleFav()"><svg class="icon"><use href="#i-star"/></svg></button>
            <a class="ap-original-link" id="articleOrigLink" href="#" target="_blank" rel="noopener"><svg class="icon"><use href="#i-external"/></svg></a>
        </div>
        <h1 class="ap-title" id="articleTitle"></h1>
        <div class="ap-meta" id="articleMeta"></div>
    </header>
    <div class="article-page-body" id="articleBody"></div>
</div>

<!-- ===== 板块文章页面（独立全屏页面） ===== -->
<div id="sectionPage" class="section-page">
    <header class="section-page-header">
        <button class="sp-back-btn" onclick="goBack()"><svg class="icon"><use href="#i-arrow-left"/></svg><span>返回</span></button>
        <h1 class="sp-title" id="sectionPageName"></h1>
        <div class="sp-meta" id="sectionPageCount"></div>
    </header>
    <div class="section-page-search">
        <input type="text" id="sectionPageSearch" placeholder="在板块内搜索..." oninput="filterSectionPage()">
    </div>
    <div class="section-page-body" id="sectionPageBody"></div>
</div>

<script src="assets/js/app.js?v=20260725b"></script>
</body>
</html>
